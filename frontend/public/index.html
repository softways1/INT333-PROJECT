<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume Screening & Evaluation Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'media',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
          colors: {
            primary: {
              DEFAULT: '#4F46E5',
              hover: '#4338CA',
              light: '#EEF2FF',
              dark: '#312E81',
            }
          },
          boxShadow: {
            subtle: '0 1px 2px 0 rgba(0, 0, 0, 0.05)',
            card: '0 1px 3px 0 rgba(0, 0, 0, 0.06), 0 1px 2px -1px rgba(0, 0, 0, 0.06)',
          }
        }
      }
    }
  </script>
  <style>
    * {
      transition: background-color 180ms ease-out, border-color 180ms ease-out;
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [backendUrl, setBackendUrl] = useState(
        window.location.hostname === 'localhost' ? 'http://localhost:5000' : `http://${window.location.hostname}:5000`
      );
      const [apiHealth, setApiHealth] = useState({ status: 'CHECKING', mongoConnected: false });
      const [resumeText, setResumeText] = useState(
        "Aman Kumar Singh\nCloud & DevOps Systems Engineer\nEmail: aman@devops.lpu.in\n\nCore Competencies:\nTerraform, Puppet, Docker, Jenkins CI/CD, Kubernetes, AWS (EC2, VPC, Security Groups, IAM), Node.js, Express, ReactJS, MongoDB Atlas, Linux Administration, Nagios Core, Git, RESTful Microservices.\n\nProfessional Experience:\n• Codified and provisioned reproducible cloud architecture on AWS using Terraform (VPC, Subnet, Route Tables, EC2).\n• Enforced deterministic system configuration baselines and security policies across target nodes via Puppet manifests.\n• Containerized multi-tier microservices into isolated Alpine Docker containers with optimized multi-stage builds.\n• Engineered automated CI/CD deployment pipelines using declarative Jenkinsfiles (Checkout -> Jest Test -> Docker Build -> Deploy).\n• Configured proactive 24/7 synthetic health monitoring and alerts using Nagios Core."
      );
      const [jobDescription, setJobDescription] = useState(
        "We are seeking a DevOps / Cloud Platform Engineer proficient in AWS, Terraform Infrastructure as Code, Docker microservices containerization, automated Jenkins CI/CD pipelines, and proactive infrastructure monitoring (Nagios/Prometheus). Working knowledge of Node.js REST APIs and React full-stack architectures is preferred."
      );
      const [file, setFile] = useState(null);
      const [loading, setLoading] = useState(false);
      const [result, setResult] = useState(null);
      const [history, setHistory] = useState([]);

      useEffect(() => {
        checkHealth();
        fetchHistory();
      }, [backendUrl]);

      const checkHealth = async () => {
        try {
          const res = await axios.get(`${backendUrl}/health`, { timeout: 3500 });
          setApiHealth(res.data);
        } catch (err) {
          setApiHealth({ status: 'OFFLINE', mongoConnected: false });
        }
      };

      const fetchHistory = async () => {
        try {
          const res = await axios.get(`${backendUrl}/api/history`, { timeout: 3500 });
          if (res.data && res.data.data) {
            setHistory(res.data.data);
          }
        } catch (err) {
          console.warn('History fetch notice:', err.message);
        }
      };

      const handleAnalyze = async (e) => {
        e.preventDefault();
        setLoading(true);
        setResult(null);

        try {
          const formData = new FormData();
          if (file) {
            formData.append('resume', file);
          } else {
            formData.append('resumeText', resumeText);
          }
          formData.append('jobDescription', jobDescription);

          const res = await axios.post(`${backendUrl}/api/analyze`, formData, {
            headers: { 'Content-Type': 'multipart/form-data' }
          });

          if (res.data.success) {
            setResult(res.data.data);
            fetchHistory();
          }
        } catch (err) {
          alert('Evaluation error: ' + (err.response?.data?.error || err.message));
        } finally {
          setLoading(false);
        }
      };

      return (
        <div class="min-h-screen flex flex-col">
          
          {/* Top Navigation */}
          <header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 sticky top-0 z-40">
            <div class="max-w-6xl mx-auto px-4 sm:px-6">
              <div class="flex items-center justify-between h-16">
                
                {/* Brand */}
                <div class="flex items-center gap-3">
                  <div class="h-8 w-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
                  </div>
                  <div>
                    <span class="text-sm font-semibold tracking-tight text-slate-900 dark:text-slate-100">
                      Resume Intelligence
                    </span>
                    <span class="text-xs text-slate-500 dark:text-slate-400 ml-2 hidden sm:inline">
                      INT333 DevOps
                    </span>
                  </div>
                </div>

                {/* Telemetry & Candidate Details */}
                <div class="flex items-center gap-2.5 sm:gap-3 text-xs">
                  
                  {/* API Status */}
                  <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300">
                    <span class={`h-1.5 w-1.5 rounded-full ${apiHealth.status === 'UP' ? 'bg-emerald-500' : 'bg-rose-500'}`}></span>
                    <span class="font-medium">API: {apiHealth.status}</span>
                  </div>

                  {/* Database Status */}
                  <div class="hidden md:inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300">
                    <span class={`h-1.5 w-1.5 rounded-full ${apiHealth.mongoConnected ? 'bg-emerald-500' : 'bg-amber-500'}`}></span>
                    <span class="font-medium">MongoDB: {apiHealth.mongoConnected ? 'Connected' : 'Standby'}</span>
                  </div>

                  {/* Author Meta */}
                  <div class="pl-2 border-l border-slate-200 dark:border-slate-800 text-slate-500 dark:text-slate-400 text-right hidden sm:block">
                    <div class="font-medium text-slate-900 dark:text-slate-100">Aman Kumar Singh</div>
                    <div class="text-[11px]">Reg: 12301704 • Roll 2</div>
                  </div>

                </div>

              </div>
            </div>
          </header>

          {/* Sub-Header: Managed Stack */}
          <div class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 py-2">
            <div class="max-w-6xl mx-auto px-4 sm:px-6 flex items-center justify-between text-xs text-slate-500 dark:text-slate-400">
              <span class="font-medium">Infrastructure Stack</span>
              <div class="flex items-center gap-3">
                <span>Terraform</span>
                <span class="text-slate-300 dark:text-slate-700">•</span>
                <span>Puppet</span>
                <span class="text-slate-300 dark:text-slate-700">•</span>
                <span>Docker</span>
                <span class="text-slate-300 dark:text-slate-700">•</span>
                <span>Jenkins</span>
                <span class="text-slate-300 dark:text-slate-700">•</span>
                <span>Nagios</span>
              </div>
            </div>
          </div>

          {/* Main Layout */}
          <main class="max-w-6xl mx-auto w-full px-4 sm:px-6 py-8 flex-1">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
              
              {/* Left Column: Intake Form */}
              <div class="lg:col-span-5 space-y-6">
                <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-6 shadow-card">
                  <div class="border-b border-slate-100 dark:border-slate-800 pb-4 mb-5 text-left">
                    <h2 class="text-sm font-semibold tracking-tight text-slate-900 dark:text-slate-100">
                      Candidate Intake & Requirements
                    </h2>
                    <p class="text-xs text-slate-500 dark:text-slate-400 mt-1 leading-relaxed">
                      Upload a PDF resume or provide profile text to compute contextual compatibility against target requisites.
                    </p>
                  </div>

                  <form onSubmit={handleAnalyze} class="space-y-5 text-left">
                    
                    {/* File Attachment */}
                    <div>
                      <label class="block text-xs font-medium text-slate-700 dark:text-slate-300 mb-1.5">
                        Resume Document (PDF)
                      </label>
                      <div class="border border-dashed border-slate-300 dark:border-slate-700 hover:border-slate-400 dark:hover:border-slate-600 rounded-lg p-4 text-center cursor-pointer bg-slate-50/50 dark:bg-slate-950/40 transition">
                        <input
                          type="file"
                          accept=".pdf"
                          id="fileInput"
                          class="hidden"
                          onChange={(e) => setFile(e.target.files[0])}
                        />
                        <label htmlFor="fileInput" class="cursor-pointer block">
                          <svg class="w-6 h-6 mx-auto text-slate-400 dark:text-slate-500 mb-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                          </svg>
                          <span class="text-xs font-medium text-slate-900 dark:text-slate-200 block">
                            {file ? file.name : 'Select PDF resume'}
                          </span>
                          <span class="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5 block">
                            {file ? `${(file.size / 1024).toFixed(1)} KB` : 'Maximum file size 5MB'}
                          </span>
                        </label>
                      </div>
                    </div>

                    {/* Resume Plain Text */}
                    <div>
                      <div class="flex justify-between items-center mb-1.5">
                        <label class="text-xs font-medium text-slate-700 dark:text-slate-300">
                          Resume Profile Text
                        </label>
                        {file && (
                          <span class="text-[11px] text-amber-600 dark:text-amber-400">
                            PDF selected
                          </span>
                        )}
                      </div>
                      <textarea
                        rows="6"
                        disabled={!!file}
                        value={resumeText}
                        onChange={(e) => setResumeText(e.target.value)}
                        class="w-full bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-lg p-3 text-xs text-slate-800 dark:text-slate-200 font-sans focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 disabled:bg-slate-100 dark:disabled:bg-slate-900 disabled:text-slate-400 leading-relaxed"
                        placeholder="Paste resume text if document is unavailable..."
                      ></textarea>
                    </div>

                    {/* Job Description */}
                    <div>
                      <label class="block text-xs font-medium text-slate-700 dark:text-slate-300 mb-1.5">
                        Target Job Description
                      </label>
                      <textarea
                        rows="4"
                        value={jobDescription}
                        onChange={(e) => setJobDescription(e.target.value)}
                        class="w-full bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-lg p-3 text-xs text-slate-800 dark:text-slate-200 font-sans focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 leading-relaxed"
                        placeholder="Paste target job responsibilities and technical requirements..."
                      ></textarea>
                    </div>

                    {/* Primary Button */}
                    <button
                      type="submit"
                      disabled={loading}
                      class="w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-medium py-2.5 px-4 rounded-lg shadow-subtle transition flex items-center justify-center gap-2 text-xs disabled:opacity-50 cursor-pointer"
                    >
                      {loading ? (
                        <>
                          <svg class="animate-spin h-3.5 w-3.5 text-white" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                          </svg>
                          <span>Processing Evaluation with Gemini AI...</span>
                        </>
                      ) : (
                        <span>Evaluate Candidate Compatibility</span>
                      )}
                    </button>

                  </form>
                </div>
              </div>

              {/* Right Column: Evaluation Results */}
              <div class="lg:col-span-7 space-y-6 text-left">
                {result ? (
                  <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-6 shadow-card space-y-6">
                    
                    {/* Candidate & Score Summary */}
                    <div class="flex flex-col sm:flex-row sm:items-start justify-between pb-6 border-b border-slate-100 dark:border-slate-800 gap-4">
                      <div>
                        <span class="inline-block px-2 py-0.5 rounded text-[11px] font-medium bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 mb-1.5">
                          Evaluation Report
                        </span>
                        <h3 class="text-base font-semibold text-slate-900 dark:text-slate-100 tracking-tight">
                          {result.candidateName}
                        </h3>
                        <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
                          {result.email} • {result.targetJobRole || 'DevOps Platform Engineer'}
                        </p>
                      </div>

                      {/* Score Indicator */}
                      <div class="sm:text-right">
                        <div class="text-3xl font-semibold tracking-tight text-slate-900 dark:text-slate-100">
                          {result.matchScore}%
                        </div>
                        <span class="inline-block mt-0.5 text-[11px] font-medium px-2 py-0.5 rounded-full bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800/60">
                          {result.matchScore >= 80 ? 'High Compatibility' : result.matchScore >= 60 ? 'Moderate Fit' : 'Requires Review'}
                        </span>
                      </div>
                    </div>

                    {/* Progress Bar */}
                    <div>
                      <div class="w-full bg-slate-100 dark:bg-slate-800 rounded-full h-1.5 overflow-hidden">
                        <div
                          class="h-1.5 bg-indigo-600 rounded-full transition-all duration-300"
                          style={{ width: `${result.matchScore}%` }}
                        ></div>
                      </div>
                    </div>

                    {/* Extracted Skills */}
                    <div>
                      <h4 class="text-xs font-semibold tracking-tight text-slate-900 dark:text-slate-100 mb-2.5">
                        Technical Skills Identified ({result.extractedSkills?.length || 0})
                      </h4>
                      <div class="flex flex-wrap gap-1.5">
                        {result.extractedSkills?.map((skill, idx) => (
                          <span
                            key={idx}
                            class="inline-block px-2.5 py-1 rounded-md text-xs font-medium bg-slate-100 dark:bg-slate-800/80 text-slate-700 dark:text-slate-300 border border-slate-200/80 dark:border-slate-700/60"
                          >
                            {skill}
                          </span>
                        ))}
                      </div>
                    </div>

                    {/* Key Strengths */}
                    <div>
                      <h4 class="text-xs font-semibold tracking-tight text-slate-900 dark:text-slate-100 mb-2.5">
                        Candidate Strengths & Qualification Alignment
                      </h4>
                      <div class="space-y-2">
                        {result.strengths?.map((str, idx) => (
                          <div
                            key={idx}
                            class="flex items-start gap-2.5 text-xs text-slate-700 dark:text-slate-300 bg-slate-50 dark:bg-slate-950/50 p-3 rounded-lg border border-slate-200/60 dark:border-slate-800"
                          >
                            <svg class="w-4 h-4 text-emerald-600 dark:text-emerald-400 mt-0.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                            </svg>
                            <span class="leading-relaxed">{str}</span>
                          </div>
                        ))}
                      </div>
                    </div>

                    {/* Identified Skill Gaps */}
                    {result.missingSkills && result.missingSkills.length > 0 && (
                      <div>
                        <h4 class="text-xs font-semibold tracking-tight text-slate-900 dark:text-slate-100 mb-2.5">
                          Identified Competency Gaps
                        </h4>
                        <div class="flex flex-wrap gap-1.5">
                          {result.missingSkills.map((gap, idx) => (
                            <span
                              key={idx}
                              class="inline-block px-2.5 py-1 rounded-md text-xs font-medium bg-amber-50 dark:bg-amber-950/40 text-amber-800 dark:text-amber-300 border border-amber-200 dark:border-amber-800/60"
                            >
                              {gap}
                            </span>
                          ))}
                        </div>
                      </div>
                    )}

                    {/* Recruiter Evaluation Summary */}
                    <div class="bg-slate-50 dark:bg-slate-950/50 border border-slate-200/60 dark:border-slate-800 rounded-lg p-4">
                      <h4 class="text-xs font-semibold tracking-tight text-slate-900 dark:text-slate-100 mb-1.5">
                        Evaluation Assessment
                      </h4>
                      <p class="text-xs text-slate-600 dark:text-slate-400 leading-relaxed">
                        {result.recommendations}
                      </p>
                    </div>

                  </div>
                ) : (
                  /* Idle State */
                  <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-12 text-center shadow-card flex flex-col items-center justify-center min-h-[440px]">
                    <div class="h-10 w-10 rounded-lg bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-400 dark:text-slate-500 mb-3.5">
                      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                      </svg>
                    </div>
                    <h3 class="text-sm font-semibold text-slate-900 dark:text-slate-100 mb-1">
                      No Evaluation Active
                    </h3>
                    <p class="text-xs text-slate-500 dark:text-slate-400 max-w-sm leading-relaxed">
                      Configure candidate input on the left and submit to generate a structured evaluation using the Google Gemini LLM engine.
                    </p>
                  </div>
                )}
              </div>

            </div>

            {/* Historical Records Table */}
            {history.length > 0 && (
              <div class="mt-8 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl shadow-card overflow-hidden text-left">
                <div class="px-6 py-4 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center">
                  <div>
                    <h3 class="text-xs font-semibold tracking-tight text-slate-900 dark:text-slate-100 uppercase">
                      Evaluation History
                    </h3>
                    <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
                      Persisted records retrieved from MongoDB Atlas cluster.
                    </p>
                  </div>
                  <span class="text-xs text-slate-500 dark:text-slate-400">
                    {history.length} records
                  </span>
                </div>

                <div class="overflow-x-auto">
                  <table class="w-full text-left text-xs text-slate-600 dark:text-slate-400">
                    <thead class="bg-slate-50 dark:bg-slate-950/60 text-slate-500 dark:text-slate-400 text-[11px] font-semibold border-b border-slate-200 dark:border-slate-800">
                      <tr>
                        <th class="py-3 px-6">Candidate</th>
                        <th class="py-3 px-6">Role</th>
                        <th class="py-3 px-6">Match Score</th>
                        <th class="py-3 px-6">Key Skills</th>
                        <th class="py-3 px-6 text-right">Timestamp</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
                      {history.map((item, idx) => (
                        <tr key={idx} class="hover:bg-slate-50/80 dark:hover:bg-slate-800/40 transition">
                          <td class="py-3.5 px-6 font-medium text-slate-900 dark:text-slate-100">
                            {item.candidateName}
                          </td>
                          <td class="py-3.5 px-6">
                            {item.targetJobRole}
                          </td>
                          <td class="py-3.5 px-6">
                            <span class="inline-block px-2 py-0.5 rounded text-xs font-semibold bg-slate-100 dark:bg-slate-800 text-slate-900 dark:text-slate-100">
                              {item.matchScore}%
                            </span>
                          </td>
                          <td class="py-3.5 px-6 text-slate-500 dark:text-slate-400 max-w-xs truncate">
                            {item.extractedSkills?.slice(0, 4).join(', ') || 'N/A'}
                          </td>
                          <td class="py-3.5 px-6 text-right text-slate-400 dark:text-slate-500 text-[11px]">
                            {new Date(item.createdAt).toLocaleTimeString()}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}
          </main>

          {/* Clean Minimalist Footer */}
          <footer class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 py-6 mt-12 text-xs text-slate-500 dark:text-slate-400">
            <div class="max-w-6xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row justify-between items-center gap-2 text-left">
              <span>
                AI Powered Resume Analyzer • Automated DevOps Pipeline (INT333)
              </span>
              <span>
                Department of Computer Science & Engineering • Lovely Professional University
              </span>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
