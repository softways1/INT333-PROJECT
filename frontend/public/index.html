<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume Intelligence | AI Screening & DevOps Pipeline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <style>
    body {
      font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11';
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [backendUrl, setBackendUrl] = useState(
        window.location.hostname === 'localhost' ? 'http://localhost:5000' : `http://${window.location.hostname}:5000`
      );
      const [apiHealth, setApiHealth] = useState({ status: 'CHECKING', mongoConnected: false });
      const [resumeText, setResumeText] = useState(
        "Aman Kumar Singh\nDevOps & Cloud Systems Engineer | Email: aman@devops.lpu.in\n\nSkills & Competencies: Terraform, Puppet, Docker, Jenkins CI/CD, Kubernetes, AWS (EC2, VPC, IAM), Node.js, Express, ReactJS, MongoDB, Linux Administration, Nagios Core, Git, REST APIs, Microservices Architecture.\n\nProfessional Experience:\n• Codified and automated reproducible cloud infrastructure on AWS using Terraform.\n• Enforced deterministic system configuration baselines and security policies across target nodes via Puppet manifests.\n• Containerized multi-tier microservices into isolated Alpine containers using Docker and Docker Compose.\n• Architected automated continuous integration and continuous deployment pipelines using declarative Jenkinsfiles.\n• Established 24/7 proactive synthetic health checks and infrastructure telemetry via Nagios Core."
      );
      const [jobDescription, setJobDescription] = useState(
        "Seeking a DevOps / Cloud Platform Engineer with hands-on proficiency in AWS, Terraform Infrastructure as Code, Docker microservices containerization, automated Jenkins CI/CD pipelines, and proactive infrastructure monitoring (Nagios/Prometheus). Practical familiarity with Node.js and React full-stack architectures is highly valued."
      );
      const [file, setFile] = useState(null);
      const [loading, setLoading] = useState(false);
      const [result, setResult] = useState(null);
      const [history, setHistory] = useState([]);

      useEffect(() => {
        checkHealth();
        fetchHistory();
      }, [backendUrl]);

      const checkHealth = async () => {
        try {
          const res = await axios.get(`${backendUrl}/health`, { timeout: 3500 });
          setApiHealth(res.data);
        } catch (err) {
          setApiHealth({ status: 'OFFLINE', mongoConnected: false });
        }
      };

      const fetchHistory = async () => {
        try {
          const res = await axios.get(`${backendUrl}/api/history`, { timeout: 3500 });
          if (res.data && res.data.data) {
            setHistory(res.data.data);
          }
        } catch (err) {
          console.warn('History fetch notice:', err.message);
        }
      };

      const handleAnalyze = async (e) => {
        e.preventDefault();
        setLoading(true);
        setResult(null);

        try {
          const formData = new FormData();
          if (file) {
            formData.append('resume', file);
          } else {
            formData.append('resumeText', resumeText);
          }
          formData.append('jobDescription', jobDescription);

          const res = await axios.post(`${backendUrl}/api/analyze`, formData, {
            headers: { 'Content-Type': 'multipart/form-data' }
          });

          if (res.data.success) {
            setResult(res.data.data);
            fetchHistory();
          }
        } catch (err) {
          alert('Evaluation error: ' + (err.response?.data?.error || err.message));
        } finally {
          setLoading(false);
        }
      };

      return (
        <div class="min-h-screen flex flex-col bg-gray-50">
          
          {/* Top Enterprise Navigation Header */}
          <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div class="flex justify-between h-16 items-center">
                
                {/* Brand Logo & Product Name */}
                <div class="flex items-center gap-3">
                  <div class="h-9 w-9 rounded-lg bg-gray-900 flex items-center justify-center text-white shadow-sm">
                    <i class="fa-solid fa-layer-group text-sm"></i>
                  </div>
                  <div>
                    <div class="flex items-center gap-2">
                      <span class="text-base font-semibold tracking-tight text-gray-900">
                        ResumeAI Platform
                      </span>
                      <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-gray-100 text-gray-700 border border-gray-200">
                        v1.0 Enterprise
                      </span>
                    </div>
                    <p class="text-xs text-gray-500">
                      Automated Candidate Screening • INT333 DevOps Architecture
                    </p>
                  </div>
                </div>

                {/* System Telemetry & Student Meta */}
                <div class="flex items-center gap-3">
                  {/* API Health Pill */}
                  <div class="hidden sm:inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-white border border-gray-200 shadow-xs">
                    <span class={`h-2 w-2 rounded-full ${apiHealth.status === 'UP' ? 'bg-emerald-500' : 'bg-rose-500'}`}></span>
                    <span class="text-gray-600">REST API:</span>
                    <span class={`font-semibold ${apiHealth.status === 'UP' ? 'text-emerald-700' : 'text-rose-700'}`}>
                      {apiHealth.status}
                    </span>
                  </div>

                  {/* Database Pill */}
                  <div class="hidden sm:inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-white border border-gray-200 shadow-xs">
                    <span class={`h-2 w-2 rounded-full ${apiHealth.mongoConnected ? 'bg-emerald-500' : 'bg-amber-500'}`}></span>
                    <span class="text-gray-600">MongoDB Atlas:</span>
                    <span class="font-semibold text-gray-900">
                      {apiHealth.mongoConnected ? 'Connected' : 'Standby'}
                    </span>
                  </div>

                  {/* User Profile Badge */}
                  <div class="flex items-center gap-2 pl-3 border-l border-gray-200 text-xs">
                    <div class="h-7 w-7 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center font-semibold">
                      AS
                    </div>
                    <div class="hidden md:block text-left">
                      <div class="font-medium text-gray-900">Aman Kumar Singh</div>
                      <div class="text-gray-500 text-[11px]">Reg: 12301704 | Roll: 2</div>
                    </div>
                  </div>
                </div>

              </div>
            </div>
          </header>

          {/* Sub-Header: DevOps Architecture Infrastructure Bar */}
          <div class="bg-white border-b border-gray-200 py-2.5">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-wrap items-center justify-between text-xs text-gray-600 gap-2">
              <div class="flex items-center gap-2 text-gray-500 font-medium">
                <i class="fa-solid fa-server text-gray-400"></i>
                <span>Managed Cloud Stack:</span>
              </div>
              <div class="flex flex-wrap items-center gap-3 font-medium">
                <span class="inline-flex items-center gap-1.5 text-gray-700">
                  <span class="h-1.5 w-1.5 rounded-full bg-purple-500"></span> Terraform (IaC)
                </span>
                <span class="text-gray-300">•</span>
                <span class="inline-flex items-center gap-1.5 text-gray-700">
                  <span class="h-1.5 w-1.5 rounded-full bg-amber-500"></span> Puppet (Config)
                </span>
                <span class="text-gray-300">•</span>
                <span class="inline-flex items-center gap-1.5 text-gray-700">
                  <span class="h-1.5 w-1.5 rounded-full bg-blue-500"></span> Docker (Containers)
                </span>
                <span class="text-gray-300">•</span>
                <span class="inline-flex items-center gap-1.5 text-gray-700">
                  <span class="h-1.5 w-1.5 rounded-full bg-rose-500"></span> Jenkins (CI/CD)
                </span>
                <span class="text-gray-300">•</span>
                <span class="inline-flex items-center gap-1.5 text-gray-700">
                  <span class="h-1.5 w-1.5 rounded-full bg-emerald-500"></span> Nagios (Monitoring)
                </span>
              </div>
            </div>
          </div>

          {/* Main Evaluation Workspace */}
          <main class="max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8 flex-1">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
              
              {/* Left Column: Upload & Configuration Form */}
              <div class="lg:col-span-5 space-y-6">
                <div class="bg-white border border-gray-200 rounded-xl shadow-xs p-6">
                  <div class="border-b border-gray-100 pb-4 mb-5">
                    <h2 class="text-base font-semibold text-gray-900">
                      Candidate Profile & Job Requirements
                    </h2>
                    <p class="text-xs text-gray-500 mt-0.5">
                      Provide a resume document or text profile to trigger semantic AI scoring.
                    </p>
                  </div>

                  <form onSubmit={handleAnalyze} class="space-y-5">
                    
                    {/* Minimalist File Upload Zone */}
                    <div>
                      <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-2">
                        Resume Document (PDF)
                      </label>
                      <div class="border border-dashed border-gray-300 hover:border-gray-400 rounded-lg p-5 text-center cursor-pointer bg-gray-50/50 hover:bg-gray-50 transition-colors">
                        <input
                          type="file"
                          accept=".pdf"
                          id="fileInput"
                          class="hidden"
                          onChange={(e) => setFile(e.target.files[0])}
                        />
                        <label htmlFor="fileInput" class="cursor-pointer block">
                          <i class="fa-regular fa-file-pdf text-2xl text-gray-400 mb-2"></i>
                          <p class="text-sm font-medium text-gray-800">
                            {file ? file.name : 'Click to select or drag PDF file'}
                          </p>
                          <p class="text-xs text-gray-500 mt-1">
                            Standard PDF format (Up to 5MB)
                          </p>
                        </label>
                      </div>
                    </div>

                    {/* Resume Plain Text Input */}
                    <div>
                      <div class="flex justify-between items-center mb-1.5">
                        <label class="text-xs font-semibold text-gray-700 uppercase tracking-wider">
                          Resume Profile Text
                        </label>
                        {file && (
                          <span class="text-xs font-medium text-amber-600">
                            PDF selected (overrides text)
                          </span>
                        )}
                      </div>
                      <textarea
                        rows="6"
                        disabled={!!file}
                        value={resumeText}
                        onChange={(e) => setResumeText(e.target.value)}
                        class="w-full bg-white border border-gray-300 focus:border-gray-900 focus:ring-1 focus:ring-gray-900 rounded-lg p-3 text-xs text-gray-800 font-mono disabled:bg-gray-100 disabled:text-gray-400 transition"
                        placeholder="Paste resume text if PDF is unavailable..."
                      ></textarea>
                    </div>

                    {/* Job Description Input */}
                    <div>
                      <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1.5">
                        Target Job Description & Criteria
                      </label>
                      <textarea
                        rows="4"
                        value={jobDescription}
                        onChange={(e) => setJobDescription(e.target.value)}
                        class="w-full bg-white border border-gray-300 focus:border-gray-900 focus:ring-1 focus:ring-gray-900 rounded-lg p-3 text-xs text-gray-800 font-mono transition"
                        placeholder="Specify target job responsibilities and technical qualifications..."
                      ></textarea>
                    </div>

                    {/* Primary Action Button (Clean, FAANG solid style) */}
                    <button
                      type="submit"
                      disabled={loading}
                      class="w-full bg-gray-900 hover:bg-gray-800 active:bg-black text-white font-medium py-3 px-4 rounded-lg shadow-xs transition flex items-center justify-center gap-2 text-sm disabled:opacity-50"
                    >
                      {loading ? (
                        <>
                          <i class="fa-solid fa-circle-notch fa-spin text-sm"></i>
                          <span>Processing Evaluation with Gemini AI...</span>
                        </>
                      ) : (
                        <>
                          <i class="fa-solid fa-chart-simple text-sm"></i>
                          <span>Analyze Candidate Fit</span>
                        </>
                      )}
                    </button>
                  </form>
                </div>
              </div>

              {/* Right Column: Structured AI Evaluation Report */}
              <div class="lg:col-span-7 space-y-6">
                {result ? (
                  <div class="bg-white border border-gray-200 rounded-xl shadow-xs p-6 space-y-6">
                    
                    {/* Candidate Score Summary Card */}
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between pb-6 border-b border-gray-100 gap-4">
                      <div>
                        <div class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded text-xs font-medium bg-gray-100 text-gray-700 mb-2">
                          Evaluation Complete
                        </div>
                        <h3 class="text-xl font-bold text-gray-900">
                          {result.candidateName}
                        </h3>
                        <p class="text-xs text-gray-500 mt-0.5">
                          {result.email} • Target Role: {result.targetJobRole || 'DevOps Engineer'}
                        </p>
                      </div>

                      {/* Clean Metric Badge */}
                      <div class="sm:text-right flex items-center sm:block gap-3">
                        <div class="text-3xl font-extrabold text-gray-900 tracking-tight">
                          {result.matchScore}%
                        </div>
                        <div class="text-xs font-medium text-emerald-700 bg-emerald-50 border border-emerald-200 px-2.5 py-0.5 rounded-full inline-block mt-0.5">
                          {result.matchScore >= 80 ? 'Strong Match' : result.matchScore >= 60 ? 'Moderate Match' : 'Potential Fit'}
                        </div>
                      </div>
                    </div>

                    {/* Progress Bar */}
                    <div>
                      <div class="w-full bg-gray-100 rounded-full h-2 overflow-hidden">
                        <div
                          class={`h-2 rounded-full transition-all duration-700 ${result.matchScore >= 75 ? 'bg-gray-900' : 'bg-blue-600'}`}
                          style={{ width: `${result.matchScore}%` }}
                        ></div>
                      </div>
                    </div>

                    {/* Extracted Skills Badges */}
                    <div>
                      <h4 class="text-xs font-semibold text-gray-700 uppercase tracking-wider mb-2.5">
                        Identified Technical Skills ({result.extractedSkills?.length || 0})
                      </h4>
                      <div class="flex flex-wrap gap-1.5">
                        {result.extractedSkills?.map((skill, idx) => (
                          <span
                            key={idx}
                            class="inline-flex items-center px-2.5 py-1 rounded-md text-xs font-medium bg-gray-100 text-gray-800 border border-gray-200"
                          >
                            {skill}
                          </span>
                        ))}
                      </div>
                    </div>

                    {/* Strengths & Alignment */}
                    <div>
                      <h4 class="text-xs font-semibold text-gray-700 uppercase tracking-wider mb-2">
                        Demonstrated Strengths
                      </h4>
                      <div class="space-y-2">
                        {result.strengths?.map((str, idx) => (
                          <div
                            key={idx}
                            class="flex items-start gap-2.5 text-xs text-gray-700 bg-gray-50 p-2.5 rounded-lg border border-gray-200/80"
                          >
                            <i class="fa-solid fa-check text-emerald-600 mt-0.5"></i>
                            <span>{str}</span>
                          </div>
                        ))}
                      </div>
                    </div>

                    {/* Skill Gaps / Missing Requisites */}
                    {result.missingSkills && result.missingSkills.length > 0 && (
                      <div>
                        <h4 class="text-xs font-semibold text-gray-700 uppercase tracking-wider mb-2">
                          Skill Gaps & Missing Tools
                        </h4>
                        <div class="flex flex-wrap gap-1.5">
                          {result.missingSkills.map((gap, idx) => (
                            <span
                              key={idx}
                              class="inline-flex items-center px-2.5 py-1 rounded-md text-xs font-medium bg-amber-50 text-amber-800 border border-amber-200"
                            >
                              <i class="fa-solid fa-circle-exclamation text-[10px] mr-1.5"></i>
                              {gap}
                            </span>
                          ))}
                        </div>
                      </div>
                    )}

                    {/* Gemini AI Recruiter Recommendations */}
                    <div class="bg-gray-50 border border-gray-200 rounded-lg p-4">
                      <div class="flex items-center gap-2 mb-1.5">
                        <i class="fa-solid fa-robot text-gray-500 text-xs"></i>
                        <h4 class="text-xs font-semibold text-gray-900 uppercase tracking-wider">
                          Google Gemini LLM Evaluation
                        </h4>
                      </div>
                      <p class="text-xs text-gray-600 leading-relaxed">
                        {result.recommendations}
                      </p>
                    </div>

                  </div>
                ) : (
                  /* Empty State View */
                  <div class="bg-white border border-gray-200 rounded-xl p-12 text-center shadow-xs flex flex-col items-center justify-center min-h-[440px]">
                    <div class="h-12 w-12 rounded-full bg-gray-100 flex items-center justify-center text-gray-400 mb-4">
                      <i class="fa-regular fa-clipboard text-xl"></i>
                    </div>
                    <h3 class="text-base font-semibold text-gray-900 mb-1">
                      No Evaluation Generated Yet
                    </h3>
                    <p class="text-xs text-gray-500 max-w-sm mb-6">
                      Click the "Analyze Candidate Fit" button on the left to extract structured candidate insights and compute semantic compatibility.
                    </p>
                    <div class="inline-flex items-center gap-4 text-xs text-gray-400">
                      <span class="flex items-center gap-1.5">
                        <i class="fa-solid fa-bolt text-gray-400"></i> Instant Scoring
                      </span>
                      <span>•</span>
                      <span class="flex items-center gap-1.5">
                        <i class="fa-solid fa-database text-gray-400"></i> MongoDB Cloud Audit
                      </span>
                    </div>
                  </div>
                )}
              </div>
            </div>

            {/* Historical Candidate Records Table (Clean Stripe / GitHub Data Table) */}
            {history.length > 0 && (
              <div class="mt-10 bg-white border border-gray-200 rounded-xl shadow-xs overflow-hidden">
                <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center">
                  <div>
                    <h3 class="text-sm font-semibold text-gray-900">
                      Recent Candidate Evaluations
                    </h3>
                    <p class="text-xs text-gray-500">
                      Persistent audit records saved directly in MongoDB Atlas cluster.
                    </p>
                  </div>
                  <span class="text-xs font-medium text-gray-500">
                    Showing latest {history.length} records
                  </span>
                </div>

                <div class="overflow-x-auto">
                  <table class="w-full text-left text-xs text-gray-600">
                    <thead class="text-[11px] uppercase bg-gray-50 text-gray-500 border-b border-gray-200 font-semibold tracking-wider">
                      <tr>
                        <th class="py-3 px-6">Candidate</th>
                        <th class="py-3 px-6">Target Role</th>
                        <th class="py-3 px-6">Match Score</th>
                        <th class="py-3 px-6">Core Skills</th>
                        <th class="py-3 px-6 text-right">Timestamp</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100">
                      {history.map((item, idx) => (
                        <tr key={idx} class="hover:bg-gray-50/80 transition-colors">
                          <td class="py-3.5 px-6 font-medium text-gray-900">
                            {item.candidateName}
                          </td>
                          <td class="py-3.5 px-6 text-gray-600">
                            {item.targetJobRole}
                          </td>
                          <td class="py-3.5 px-6">
                            <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-gray-100 text-gray-900 border border-gray-200">
                              {item.matchScore}%
                            </span>
                          </td>
                          <td class="py-3.5 px-6 text-gray-500 max-w-xs truncate">
                            {item.extractedSkills?.slice(0, 4).join(', ') || 'N/A'}
                          </td>
                          <td class="py-3.5 px-6 text-gray-400 text-right font-mono text-[11px]">
                            {new Date(item.createdAt).toLocaleTimeString()}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}
          </main>

          {/* Minimalist Professional Footer */}
          <footer class="bg-white border-t border-gray-200 py-6 mt-12">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row justify-between items-center gap-3 text-xs text-gray-500">
              <p>
                © 2026 AI Powered Resume Analyzer • Automated DevOps Lifecycle Pipeline (INT333)
              </p>
              <p class="font-medium text-gray-600">
                Department of Computer Science & Engineering • Lovely Professional University
              </p>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
