<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ResumeAI • Intelligent Recruitment & DevOps Pipeline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            brand: {
              orange: '#F26207',
              coral: '#FF5C00',
              amber: '#FF9900',
              cyan: '#00D8F6',
              green: '#00E599',
              dark: '#0E1116',
              surface: '#161B22',
              card: '#1C2128',
              border: '#2D333B',
              borderMuted: '#22272E',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Custom Replit-style subtle grid backdrop */
    .replit-grid {
      background-color: #0E1116;
      background-image: radial-gradient(#24292F 1px, transparent 1px);
      background-size: 24px 24px;
    }
    .replit-glow-orange {
      box-shadow: 0 0 25px -4px rgba(242, 98, 7, 0.35);
    }
    .replit-glow-green {
      box-shadow: 0 0 25px -4px rgba(0, 229, 153, 0.35);
    }
    /* Sleek custom scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #161B22;
    }
    ::-webkit-scrollbar-thumb {
      background: #30363D;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #484F58;
    }
  </style>
</head>
<body class="replit-grid text-[#E6EDF3] min-h-screen font-sans antialiased selection:bg-[#F26207] selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [backendUrl, setBackendUrl] = useState(
        window.location.hostname === 'localhost' ? 'http://localhost:5000' : `http://${window.location.hostname}:5000`
      );
      const [apiHealth, setApiHealth] = useState({ status: 'CHECKING', mongoConnected: false });
      const [resumeText, setResumeText] = useState(
        "Aman Kumar Singh\nDevOps & Full Stack Cloud Systems Engineer\nEmail: aman@devops.lpu.in | Phone: +91 98765 43210\n\nCore Competencies:\nTerraform, Puppet, Docker, Jenkins CI/CD, Kubernetes, AWS (EC2, VPC, IAM, Security Groups), Node.js, Express.js, ReactJS, MongoDB Atlas, Linux Administration, Nagios Core, Git, RESTful Microservices.\n\nProfessional Experience & Highlights:\n• Codified and provisioned reproducible cloud architecture on AWS using HashiCorp Terraform (VPC, Subnet, Route Tables, EC2).\n• Enforced deterministic system configuration baselines and security policies across target nodes via Puppet manifests.\n• Containerized multi-tier microservices into isolated Alpine Docker containers with optimized multi-stage builds.\n• Engineered automated CI/CD deployment pipelines using declarative Jenkinsfiles (Checkout -> Jest Test -> Docker Build -> Deploy).\n• Configured proactive 24/7 synthetic health monitoring and alerts using Nagios Core."
      );
      const [jobDescription, setJobDescription] = useState(
        "We are looking for an experienced DevOps / Cloud Platform Engineer proficient in AWS, Terraform Infrastructure as Code, Docker microservices containerization, automated Jenkins CI/CD pipelines, and proactive infrastructure monitoring (Nagios/Prometheus). Practical experience with Node.js REST APIs and React full-stack architectures is a strong plus."
      );
      const [file, setFile] = useState(null);
      const [loading, setLoading] = useState(false);
      const [result, setResult] = useState(null);
      const [history, setHistory] = useState([]);
      const [activeInputTab, setActiveInputTab] = useState('editor');

      useEffect(() => {
        checkHealth();
        fetchHistory();
      }, [backendUrl]);

      const checkHealth = async () => {
        try {
          const res = await axios.get(`${backendUrl}/health`, { timeout: 3500 });
          setApiHealth(res.data);
        } catch (err) {
          setApiHealth({ status: 'OFFLINE', mongoConnected: false });
        }
      };

      const fetchHistory = async () => {
        try {
          const res = await axios.get(`${backendUrl}/api/history`, { timeout: 3500 });
          if (res.data && res.data.data) {
            setHistory(res.data.data);
          }
        } catch (err) {
          console.warn('History notice:', err.message);
        }
      };

      const handleAnalyze = async (e) => {
        e.preventDefault();
        setLoading(true);
        setResult(null);

        try {
          const formData = new FormData();
          if (file) {
            formData.append('resume', file);
          } else {
            formData.append('resumeText', resumeText);
          }
          formData.append('jobDescription', jobDescription);

          const res = await axios.post(`${backendUrl}/api/analyze`, formData, {
            headers: { 'Content-Type': 'multipart/form-data' }
          });

          if (res.data.success) {
            setResult(res.data.data);
            fetchHistory();
          }
        } catch (err) {
          alert('Analysis error: ' + (err.response?.data?.error || err.message));
        } finally {
          setLoading(false);
        }
      };

      return (
        <div class="min-h-screen flex flex-col">
          
          {/* Top Bar (Replit / Linear Dark Studio Header) */}
          <header class="bg-[#161B22]/90 backdrop-blur-md border-b border-[#30363D] sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div class="flex items-center justify-between h-14">
                
                {/* Brand / Logo */}
                <div class="flex items-center gap-3">
                  <div class="h-8 w-8 rounded-md bg-gradient-to-tr from-[#F26207] to-[#FF9900] flex items-center justify-center text-white font-mono font-bold text-base shadow-sm">
                    <i class="fa-solid fa-bolt-lightning text-xs"></i>
                  </div>
                  <div class="flex items-center gap-2">
                    <span class="font-bold tracking-tight text-white text-base">
                      ResumeAI
                    </span>
                    <span class="text-xs px-2 py-0.5 rounded-full bg-[#21262D] text-[#8B949E] border border-[#30363D] font-mono">
                      studio v2.4
                    </span>
                  </div>
                  <span class="text-[#484F58] hidden md:inline">/</span>
                  <span class="text-xs text-[#8B949E] hidden md:inline font-mono">
                    INT333 • Enterprise DevOps Pipeline
                  </span>
                </div>

                {/* Status Badges & Student Badge */}
                <div class="flex items-center gap-3">
                  {/* API Status Badge */}
                  <div class="flex items-center gap-2 px-2.5 py-1 rounded-md bg-[#0E1116] border border-[#30363D] text-xs font-mono">
                    <span class={`h-2 w-2 rounded-full ${apiHealth.status === 'UP' ? 'bg-[#00E599] animate-pulse' : 'bg-rose-500'}`}></span>
                    <span class="text-[#8B949E]">api:</span>
                    <span class={apiHealth.status === 'UP' ? 'text-[#00E599] font-semibold' : 'text-rose-400'}>
                      {apiHealth.status}
                    </span>
                  </div>

                  {/* MongoDB Atlas Badge */}
                  <div class="hidden sm:flex items-center gap-2 px-2.5 py-1 rounded-md bg-[#0E1116] border border-[#30363D] text-xs font-mono">
                    <i class="fa-solid fa-database text-[#00D8F6] text-[11px]"></i>
                    <span class="text-[#8B949E]">mongo:</span>
                    <span class={`font-semibold ${apiHealth.mongoConnected ? 'text-[#00E599]' : 'text-[#FF9900]'}`}>
                      {apiHealth.mongoConnected ? 'atlas_online' : 'standby'}
                    </span>
                  </div>

                  {/* Candidate Identity */}
                  <div class="flex items-center gap-2.5 pl-3 border-l border-[#30363D]">
                    <div class="h-7 w-7 rounded-full bg-[#F26207]/20 border border-[#F26207]/50 text-[#F26207] flex items-center justify-center font-bold text-xs font-mono">
                      AK
                    </div>
                    <div class="hidden lg:block text-left">
                      <div class="text-xs font-semibold text-white leading-tight">Aman Kumar Singh</div>
                      <div class="text-[10px] text-[#8B949E] font-mono">Roll: 02 | Reg: 12301704</div>
                    </div>
                  </div>
                </div>

              </div>
            </div>
          </header>

          {/* DevOps Toolchain Status Ribbon */}
          <div class="bg-[#0E1116] border-b border-[#21262D] px-4 py-2 text-xs">
            <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-2">
              <div class="flex items-center gap-2 text-[#8B949E] font-mono">
                <i class="fa-solid fa-terminal text-[#F26207] text-[11px]"></i>
                <span>Active DevOps Toolchain:</span>
              </div>
              <div class="flex flex-wrap items-center gap-2.5 text-xs font-mono">
                <span class="px-2 py-0.5 rounded bg-[#161B22] border border-[#30363D] text-[#A5D6FF] flex items-center gap-1.5">
                  <i class="fa-solid fa-cube text-[10px] text-[#00D8F6]"></i> Terraform
                </span>
                <span class="px-2 py-0.5 rounded bg-[#161B22] border border-[#30363D] text-[#FFA657] flex items-center gap-1.5">
                  <i class="fa-solid fa-wrench text-[10px] text-[#FF9900]"></i> Puppet
                </span>
                <span class="px-2 py-0.5 rounded bg-[#161B22] border border-[#30363D] text-[#79C0FF] flex items-center gap-1.5">
                  <i class="fa-brands fa-docker text-[11px] text-[#388BFD]"></i> Docker
                </span>
                <span class="px-2 py-0.5 rounded bg-[#161B22] border border-[#30363D] text-[#FF7B72] flex items-center gap-1.5">
                  <i class="fa-brands fa-jenkins text-[11px] text-[#F85149]"></i> Jenkins
                </span>
                <span class="px-2 py-0.5 rounded bg-[#161B22] border border-[#30363D] text-[#7EE787] flex items-center gap-1.5">
                  <i class="fa-solid fa-heart-pulse text-[10px] text-[#00E599]"></i> Nagios
                </span>
              </div>
            </div>
          </div>

          {/* Main Studio Workspace */}
          <main class="max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-6 flex-1">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
              
              {/* Left Column: Input Panel (IDE Workspace feel) */}
              <div class="lg:col-span-5 space-y-4">
                <div class="bg-[#161B22] border border-[#30363D] rounded-xl overflow-hidden shadow-xl">
                  
                  {/* Pane Header with Workspace Tabs */}
                  <div class="bg-[#0E1116] px-4 py-2.5 border-b border-[#30363D] flex items-center justify-between">
                    <div class="flex items-center gap-2">
                      <span class="h-2.5 w-2.5 rounded-full bg-[#FF5F56]"></span>
                      <span class="h-2.5 w-2.5 rounded-full bg-[#FFBD2E]"></span>
                      <span class="h-2.5 w-2.5 rounded-full bg-[#27C93F]"></span>
                      <span class="ml-2 font-mono text-xs font-semibold text-[#C9D1D9]">
                        candidate_input.json
                      </span>
                    </div>
                    <div class="flex items-center gap-1 bg-[#161B22] p-0.5 rounded border border-[#30363D] text-[11px] font-mono">
                      <button
                        type="button"
                        onClick={() => setActiveInputTab('editor')}
                        class={`px-2 py-0.5 rounded transition ${activeInputTab === 'editor' ? 'bg-[#30363D] text-white font-semibold' : 'text-[#8B949E] hover:text-white'}`}
                      >
                        Text Editor
                      </button>
                      <button
                        type="button"
                        onClick={() => setActiveInputTab('upload')}
                        class={`px-2 py-0.5 rounded transition ${activeInputTab === 'upload' ? 'bg-[#30363D] text-white font-semibold' : 'text-[#8B949E] hover:text-white'}`}
                      >
                        PDF Upload
                      </button>
                    </div>
                  </div>

                  <form onSubmit={handleAnalyze} class="p-5 space-y-5">
                    
                    {/* Mode 1: PDF Dropzone */}
                    {activeInputTab === 'upload' && (
                      <div>
                        <label class="block text-xs font-mono uppercase text-[#8B949E] mb-2 tracking-wider">
                          Attach Candidate Resume (PDF)
                        </label>
                        <div class="border-2 border-dashed border-[#30363D] hover:border-[#F26207] bg-[#0E1116] hover:bg-[#161B22] rounded-xl p-6 text-center cursor-pointer transition-all group">
                          <input
                            type="file"
                            accept=".pdf"
                            id="fileInput"
                            class="hidden"
                            onChange={(e) => setFile(e.target.files[0])}
                          />
                          <label htmlFor="fileInput" class="cursor-pointer block">
                            <div class="h-10 w-10 mx-auto rounded-lg bg-[#21262D] group-hover:bg-[#F26207]/20 text-[#8B949E] group-hover:text-[#F26207] flex items-center justify-center transition mb-3">
                              <i class="fa-solid fa-file-arrow-up text-lg"></i>
                            </div>
                            <p class="text-xs font-semibold text-white">
                              {file ? file.name : 'Click to browse or drop resume PDF'}
                            </p>
                            <p class="text-[11px] text-[#8B949E] mt-1 font-mono">
                              {file ? `${(file.size / 1024).toFixed(1)} KB` : 'Supports standard binary PDF (Max 5MB)'}
                            </p>
                          </label>
                        </div>
                      </div>
                    )}

                    {/* Mode 2: Code/Textarea Input */}
                    {activeInputTab === 'editor' && (
                      <div>
                        <div class="flex justify-between items-center mb-1.5 font-mono text-xs">
                          <label class="text-[#8B949E] uppercase tracking-wider">
                            Resume Plaintext Buffer
                          </label>
                          {file && (
                            <span class="text-[#FF9900]">
                              (PDF attached: text overridden)
                            </span>
                          )}
                        </div>
                        <div class="relative rounded-lg border border-[#30363D] bg-[#0E1116] overflow-hidden focus-within:border-[#F26207] transition">
                          <textarea
                            rows="7"
                            disabled={!!file}
                            value={resumeText}
                            onChange={(e) => setResumeText(e.target.value)}
                            class="w-full bg-transparent p-3 text-xs text-[#E6EDF3] font-mono focus:outline-none disabled:opacity-40 leading-relaxed"
                            placeholder="// Paste technical resume content here..."
                          ></textarea>
                        </div>
                      </div>
                    )}

                    {/* Target Job Specification Input */}
                    <div>
                      <label class="block text-xs font-mono uppercase text-[#8B949E] mb-1.5 tracking-wider">
                        Target Job Description / Requisites
                      </label>
                      <div class="relative rounded-lg border border-[#30363D] bg-[#0E1116] overflow-hidden focus-within:border-[#F26207] transition">
                        <textarea
                          rows="4"
                          value={jobDescription}
                          onChange={(e) => setJobDescription(e.target.value)}
                          class="w-full bg-transparent p-3 text-xs text-[#E6EDF3] font-mono focus:outline-none leading-relaxed"
                          placeholder="// Paste target role qualifications..."
                        ></textarea>
                      </div>
                    </div>

                    {/* Signature Replit-Orange Action Button */}
                    <button
                      type="submit"
                      disabled={loading}
                      class="w-full bg-[#F26207] hover:bg-[#FF7315] active:bg-[#D95304] text-white font-semibold py-3 px-4 rounded-lg replit-glow-orange transition-all flex items-center justify-center gap-2.5 text-sm disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer"
                    >
                      {loading ? (
                        <>
                          <i class="fa-solid fa-spinner fa-spin text-sm"></i>
                          <span class="font-mono text-xs">Evaluating via Gemini 1.5 Flash...</span>
                        </>
                      ) : (
                        <>
                          <i class="fa-solid fa-microchip text-sm"></i>
                          <span>Run AI Semantic Match</span>
                        </>
                      )}
                    </button>

                  </form>
                </div>
              </div>

              {/* Right Column: AI Output Studio */}
              <div class="lg:col-span-7 space-y-4">
                {result ? (
                  <div class="bg-[#161B22] border border-[#30363D] rounded-xl overflow-hidden shadow-xl">
                    
                    {/* Header Banner: Compatibility Metric */}
                    <div class="bg-gradient-to-r from-[#1C2128] via-[#161B22] to-[#1C2128] p-6 border-b border-[#30363D]">
                      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div>
                          <div class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded bg-[#0E1116] border border-[#30363D] text-[11px] font-mono text-[#00E599] mb-2">
                            <span class="h-1.5 w-1.5 rounded-full bg-[#00E599] animate-pulse"></span>
                            AI_ANALYSIS_SUCCESS
                          </div>
                          <h3 class="text-xl font-bold text-white tracking-tight">
                            {result.candidateName}
                          </h3>
                          <p class="text-xs text-[#8B949E] font-mono mt-0.5">
                            {result.email} • {result.targetJobRole || 'DevOps Platform Engineer'}
                          </p>
                        </div>

                        {/* Radial Gauge / High-Tech Score */}
                        <div class="flex items-center gap-4 bg-[#0E1116] border border-[#30363D] px-4 py-3 rounded-xl shadow-inner">
                          <div class="text-right">
                            <div class="text-[10px] uppercase font-mono tracking-wider text-[#8B949E]">
                              Fit Score
                            </div>
                            <div class="text-xs font-bold text-[#00E599]">
                              {result.matchScore >= 80 ? 'Optimal Candidate' : result.matchScore >= 60 ? 'Competent Match' : 'Gap Detected'}
                            </div>
                          </div>
                          <div class="h-14 w-14 rounded-full border-2 border-[#00E599] flex items-center justify-center bg-[#00E599]/10 replit-glow-green font-mono font-extrabold text-xl text-[#00E599]">
                            {result.matchScore}%
                          </div>
                        </div>
                      </div>

                      {/* Precision Progress Bar */}
                      <div class="mt-4 w-full bg-[#0E1116] rounded-full h-1.5 border border-[#30363D] overflow-hidden">
                        <div
                          class="h-full bg-gradient-to-r from-[#F26207] via-[#00D8F6] to-[#00E599] rounded-full transition-all duration-1000"
                          style={{ width: `${result.matchScore}%` }}
                        ></div>
                      </div>
                    </div>

                    <div class="p-6 space-y-6">
                      
                      {/* Technical Skills Extracted */}
                      <div>
                        <div class="flex items-center justify-between mb-2.5">
                          <h4 class="text-xs font-mono font-semibold uppercase tracking-wider text-[#8B949E] flex items-center gap-2">
                            <i class="fa-solid fa-code text-[#00D8F6]"></i>
                            Extracted Technical Entities ({result.extractedSkills?.length || 0})
                          </h4>
                          <span class="text-[11px] font-mono text-[#8B949E]">
                            Confidence: 0.96
                          </span>
                        </div>
                        <div class="flex flex-wrap gap-2">
                          {result.extractedSkills?.map((skill, idx) => (
                            <span
                              key={idx}
                              class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded bg-[#21262D] hover:bg-[#30363D] border border-[#30363D] text-xs font-mono text-[#C9D1D9] transition-colors"
                            >
                              <span class="h-1.5 w-1.5 rounded-full bg-[#00D8F6]"></span>
                              {skill}
                            </span>
                          ))}
                        </div>
                      </div>

                      {/* Candidate Key Strengths */}
                      <div>
                        <h4 class="text-xs font-mono font-semibold uppercase tracking-wider text-[#00E599] mb-2.5 flex items-center gap-2">
                          <i class="fa-solid fa-circle-check"></i>
                          Demonstrated Strengths & Alignment
                        </h4>
                        <div class="space-y-2">
                          {result.strengths?.map((str, idx) => (
                            <div
                              key={idx}
                              class="flex items-start gap-2.5 p-3 rounded-lg bg-[#0E1116] border border-[#21262D] text-xs text-[#C9D1D9] leading-relaxed"
                            >
                              <i class="fa-solid fa-check text-[#00E599] mt-0.5"></i>
                              <span>{str}</span>
                            </div>
                          ))}
                        </div>
                      </div>

                      {/* Skill Gap Analysis */}
                      {result.missingSkills && result.missingSkills.length > 0 && (
                        <div>
                          <h4 class="text-xs font-mono font-semibold uppercase tracking-wider text-[#FF9900] mb-2.5 flex items-center gap-2">
                            <i class="fa-solid fa-triangle-exclamation"></i>
                            Identified Skill Gaps
                          </h4>
                          <div class="flex flex-wrap gap-2">
                            {result.missingSkills.map((gap, idx) => (
                              <span
                                key={idx}
                                class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded bg-[#FF9900]/10 border border-[#FF9900]/30 text-xs font-mono text-[#FFA657]"
                              >
                                <i class="fa-solid fa-minus text-[10px]"></i>
                                {gap}
                              </span>
                            ))}
                          </div>
                        </div>
                      )}

                      {/* Gemini LLM Recruiter Feedback */}
                      <div class="p-4 rounded-lg bg-[#0E1116] border border-[#30363D] relative">
                        <div class="flex items-center gap-2 mb-1.5 text-xs font-mono font-semibold text-[#8B949E]">
                          <i class="fa-solid fa-brain text-[#F26207]"></i>
                          <span>Google Gemini 1.5 Flash Evaluation:</span>
                        </div>
                        <p class="text-xs text-[#C9D1D9] font-sans leading-relaxed">
                          {result.recommendations}
                        </p>
                      </div>

                    </div>
                  </div>
                ) : (
                  /* Empty State: Replit Studio Console */
                  <div class="bg-[#161B22] border border-[#30363D] rounded-xl p-12 text-center shadow-xl flex flex-col items-center justify-center min-h-[460px]">
                    <div class="h-16 w-16 rounded-2xl bg-[#0E1116] border border-[#30363D] flex items-center justify-center text-[#8B949E] mb-4">
                      <i class="fa-solid fa-terminal text-2xl text-[#F26207]"></i>
                    </div>
                    <h3 class="text-base font-bold text-white mb-1">
                      AI Screening Console Idle
                    </h3>
                    <p class="text-xs text-[#8B949E] max-w-sm mb-6 leading-relaxed">
                      Select candidate profile parameters on the left and trigger the Gemini LLM engine to extract structured match insights and audit to MongoDB Atlas.
                    </p>
                    <div class="flex flex-wrap items-center justify-center gap-4 text-xs font-mono text-[#8B949E]">
                      <span class="flex items-center gap-1.5">
                        <span class="h-1.5 w-1.5 rounded-full bg-[#00E599]"></span> Microservices Active
                      </span>
                      <span>•</span>
                      <span class="flex items-center gap-1.5">
                        <span class="h-1.5 w-1.5 rounded-full bg-[#00D8F6]"></span> Gemini 1.5 Ready
                      </span>
                    </div>
                  </div>
                )}
              </div>

            </div>

            {/* Candidate Audit History (Sleek Replit / GitHub Style Data Table) */}
            {history.length > 0 && (
              <div class="mt-8 bg-[#161B22] border border-[#30363D] rounded-xl overflow-hidden shadow-xl">
                <div class="px-5 py-3.5 bg-[#0E1116] border-b border-[#30363D] flex items-center justify-between">
                  <div class="flex items-center gap-2">
                    <i class="fa-solid fa-clock-rotate-left text-[#00D8F6] text-xs"></i>
                    <h3 class="text-xs font-mono font-semibold uppercase text-white">
                      MongoDB Persistent Audit Log
                    </h3>
                  </div>
                  <span class="text-[11px] font-mono text-[#8B949E]">
                    {history.length} records retrieved
                  </span>
                </div>

                <div class="overflow-x-auto">
                  <table class="w-full text-left text-xs font-mono text-[#C9D1D9]">
                    <thead class="bg-[#161B22] text-[#8B949E] text-[11px] border-b border-[#30363D] uppercase">
                      <tr>
                        <th class="py-3 px-5">Candidate</th>
                        <th class="py-3 px-5">Target Role</th>
                        <th class="py-3 px-5">Score</th>
                        <th class="py-3 px-5">Skills Sample</th>
                        <th class="py-3 px-5 text-right">Timestamp</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-[#21262D]">
                      {history.map((item, idx) => (
                        <tr key={idx} class="hover:bg-[#1C2128] transition-colors">
                          <td class="py-3 px-5 font-semibold text-white">
                            {item.candidateName}
                          </td>
                          <td class="py-3 px-5 text-[#8B949E]">
                            {item.targetJobRole}
                          </td>
                          <td class="py-3 px-5">
                            <span class={`inline-block px-2 py-0.5 rounded text-[11px] font-bold ${item.matchScore >= 80 ? 'bg-[#00E599]/15 text-[#00E599] border border-[#00E599]/30' : 'bg-[#FF9900]/15 text-[#FF9900] border border-[#FF9900]/30'}`}>
                              {item.matchScore}%
                            </span>
                          </td>
                          <td class="py-3 px-5 text-[#8B949E] max-w-xs truncate">
                            {item.extractedSkills?.slice(0, 4).join(', ') || 'N/A'}
                          </td>
                          <td class="py-3 px-5 text-right text-[#8B949E] text-[11px]">
                            {new Date(item.createdAt).toLocaleTimeString()}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}
          </main>

          {/* Minimal Dark Studio Footer */}
          <footer class="bg-[#0E1116] border-t border-[#21262D] py-4 mt-8 text-center text-xs font-mono text-[#8B949E]">
            <p>
              ResumeAI Studio • Automated DevOps Pipeline (INT333) • Lovely Professional University
            </p>
            <p class="text-[#484F58] mt-1 text-[11px]">
              Developed by Aman Kumar Singh (Reg: 12301704) • Terraform | Puppet | Docker | Jenkins | Nagios
            </p>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
