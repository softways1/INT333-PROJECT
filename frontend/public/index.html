<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Powered Resume Analyzer | DevOps Pipeline</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @keyframes pulse-slow {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    .animate-pulse-slow { animation: pulse-slow 3s infinite; }
    .gradient-header {
      background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 50%, #06b6d4 100%);
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [backendUrl, setBackendUrl] = useState(window.location.hostname === 'localhost' ? 'http://localhost:5000' : `http://${window.location.hostname}:5000`);
      const [apiHealth, setApiHealth] = useState({ status: 'CHECKING', mongoConnected: false });
      const [resumeText, setResumeText] = useState(
        "Aman Kumar Singh\nDevOps & Full Stack Engineer | Email: aman@devops.lpu.in\n\nSkills: Docker, Kubernetes, Jenkins, Terraform, Puppet, AWS, Node.js, Express, ReactJS, MongoDB, Git, Linux, Nagios, Python, REST APIs.\n\nExperience: Designed and provisioned automated infrastructure using Terraform and Puppet. Engineered multi-stage Docker microservices and orchestrated automated CI/CD deployment pipelines using Jenkins. Configured real-time Nagios infrastructure health monitoring."
      );
      const [jobDescription, setJobDescription] = useState(
        "Seeking a DevOps / Cloud Platform Engineer proficient in AWS, Terraform, Docker, Jenkins CI/CD, Linux system administration, and infrastructure monitoring (Nagios/Prometheus). Experience with Node.js and React full-stack applications is a strong plus."
      );
      const [file, setFile] = useState(null);
      const [loading, setLoading] = useState(false);
      const [result, setResult] = useState(null);
      const [history, setHistory] = useState([]);
      const [activeTab, setActiveTab] = useState('analyzer');

      useEffect(() => {
        checkHealth();
        fetchHistory();
      }, [backendUrl]);

      const checkHealth = async () => {
        try {
          const res = await axios.get(`${backendUrl}/health`, { timeout: 3000 });
          setApiHealth(res.data);
        } catch (err) {
          setApiHealth({ status: 'OFFLINE', mongoConnected: false });
        }
      };

      const fetchHistory = async () => {
        try {
          const res = await axios.get(`${backendUrl}/api/history`, { timeout: 3000 });
          if (res.data && res.data.data) {
            setHistory(res.data.data);
          }
        } catch (err) {
          console.warn('History fetch error', err);
        }
      };

      const handleAnalyze = async (e) => {
        e.preventDefault();
        setLoading(true);
        setResult(null);

        try {
          const formData = new FormData();
          if (file) {
            formData.append('resume', file);
          } else {
            formData.append('resumeText', resumeText);
          }
          formData.append('jobDescription', jobDescription);

          const res = await axios.post(`${backendUrl}/api/analyze`, formData, {
            headers: { 'Content-Type': 'multipart/form-data' }
          });

          if (res.data.success) {
            setResult(res.data.data);
            fetchHistory();
          }
        } catch (err) {
          alert('Analysis error: ' + (err.response?.data?.error || err.message));
        } finally {
          setLoading(false);
        }
      };

      return (
        <div class="min-h-screen flex flex-col">
          {/* Header */}
          <header class="gradient-header py-6 px-8 shadow-xl border-b border-blue-800">
            <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
              <div class="flex items-center gap-4">
                <div class="p-3 bg-white/10 rounded-xl backdrop-blur-md border border-white/20 shadow-inner">
                  <i class="fa-solid fa-brain text-cyan-300 text-3xl"></i>
                </div>
                <div>
                  <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight text-white flex items-center gap-3">
                    AI Resume Analyzer
                    <span class="text-xs font-semibold px-2.5 py-1 bg-cyan-400/20 text-cyan-200 border border-cyan-300/30 rounded-full uppercase">
                      DevOps Pipeline
                    </span>
                  </h1>
                  <p class="text-blue-100 text-sm mt-0.5">
                    Automated Infrastructure & Resilient CI/CD Architecture • Course INT333
                  </p>
                </div>
              </div>

              {/* Status Pills */}
              <div class="flex flex-wrap items-center gap-3">
                <div class="flex items-center gap-2 bg-slate-900/60 backdrop-blur-md px-3.5 py-1.5 rounded-lg border border-slate-700/60 text-xs">
                  <span class={`h-2.5 w-2.5 rounded-full ${apiHealth.status === 'UP' ? 'bg-emerald-400 animate-pulse' : 'bg-rose-400'}`}></span>
                  <span class="text-slate-300">API:</span>
                  <span class={`font-bold ${apiHealth.status === 'UP' ? 'text-emerald-400' : 'text-rose-400'}`}>
                    {apiHealth.status}
                  </span>
                </div>

                <div class="flex items-center gap-2 bg-slate-900/60 backdrop-blur-md px-3.5 py-1.5 rounded-lg border border-slate-700/60 text-xs">
                  <i class="fa-solid fa-database text-amber-400"></i>
                  <span class="text-slate-300">MongoDB:</span>
                  <span class={`font-bold ${apiHealth.mongoConnected ? 'text-emerald-400' : 'text-amber-400'}`}>
                    {apiHealth.mongoConnected ? 'CONNECTED' : 'STANDBY'}
                  </span>
                </div>
              </div>
            </div>
          </header>

          {/* DevOps Pipeline Architecture Bar */}
          <div class="bg-slate-950/80 border-b border-slate-800 px-6 py-3">
            <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between text-xs text-slate-400 gap-2">
              <span class="font-semibold text-slate-300">
                <i class="fa-solid fa-cubes-stacked text-blue-400 mr-1.5"></i>
                DevOps Toolchain:
              </span>
              <div class="flex flex-wrap items-center gap-4">
                <span class="flex items-center gap-1.5 text-purple-400 font-medium">
                  <i class="fa-solid fa-code-branch"></i> Terraform (IaC)
                </span>
                <span class="text-slate-600">•</span>
                <span class="flex items-center gap-1.5 text-amber-400 font-medium">
                  <i class="fa-solid fa-screwdriver-wrench"></i> Puppet (Config)
                </span>
                <span class="text-slate-600">•</span>
                <span class="flex items-center gap-1.5 text-sky-400 font-medium">
                  <i class="fa-brands fa-docker"></i> Docker (Containers)
                </span>
                <span class="text-slate-600">•</span>
                <span class="flex items-center gap-1.5 text-rose-400 font-medium">
                  <i class="fa-brands fa-jenkins"></i> Jenkins (CI/CD)
                </span>
                <span class="text-slate-600">•</span>
                <span class="flex items-center gap-1.5 text-emerald-400 font-medium">
                  <i class="fa-solid fa-chart-line"></i> Nagios (Monitoring)
                </span>
              </div>
            </div>
          </div>

          {/* Main Content */}
          <main class="max-w-7xl mx-auto w-full px-6 py-8 flex-1">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
              
              {/* Left Column: Input Form */}
              <div class="lg:col-span-6 flex flex-col gap-6">
                <div class="bg-slate-800/80 border border-slate-700/80 rounded-2xl p-6 shadow-xl backdrop-blur-sm">
                  <h2 class="text-lg font-bold text-white mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-file-arrow-up text-cyan-400"></i>
                    Upload Resume & Job Specification
                  </h2>

                  <form onSubmit={handleAnalyze} class="space-y-5">
                    {/* File Upload / Dropzone */}
                    <div>
                      <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
                        Upload Candidate Resume (PDF)
                      </label>
                      <div class="border-2 border-dashed border-slate-600 hover:border-cyan-400 rounded-xl p-4 text-center cursor-pointer transition-colors bg-slate-900/50">
                        <input
                          type="file"
                          accept=".pdf"
                          id="fileInput"
                          class="hidden"
                          onChange={(e) => setFile(e.target.files[0])}
                        />
                        <label htmlFor="fileInput" class="cursor-pointer block">
                          <i class="fa-solid fa-cloud-arrow-up text-2xl text-cyan-400 mb-2"></i>
                          <p class="text-sm font-medium text-slate-200">
                            {file ? `Selected: ${file.name}` : 'Click to browse or drop resume PDF here'}
                          </p>
                          <p class="text-xs text-slate-400 mt-1">Accepts standard PDF (Max 5MB)</p>
                        </label>
                      </div>
                    </div>

                    {/* Resume Text (Fallback/Direct) */}
                    <div>
                      <div class="flex justify-between items-center mb-1.5">
                        <label class="text-xs font-semibold text-slate-300 uppercase tracking-wider">
                          Resume Text Content
                        </label>
                        {file && (
                          <span class="text-xs text-amber-400">
                            (PDF selected; text box is overridden)
                          </span>
                        )}
                      </div>
                      <textarea
                        rows="5"
                        disabled={!!file}
                        value={resumeText}
                        onChange={(e) => setResumeText(e.target.value)}
                        class="w-full bg-slate-900/80 border border-slate-700 rounded-xl p-3 text-xs text-slate-200 focus:outline-none focus:border-cyan-400 font-mono disabled:opacity-50"
                        placeholder="Paste resume text if PDF not available..."
                      ></textarea>
                    </div>

                    {/* Job Description */}
                    <div>
                      <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">
                        Target Job Description / Requirements
                      </label>
                      <textarea
                        rows="4"
                        value={jobDescription}
                        onChange={(e) => setJobDescription(e.target.value)}
                        class="w-full bg-slate-900/80 border border-slate-700 rounded-xl p-3 text-xs text-slate-200 focus:outline-none focus:border-cyan-400 font-mono"
                        placeholder="Paste job posting requirements..."
                      ></textarea>
                    </div>

                    {/* Submit Button */}
                    <button
                      type="submit"
                      disabled={loading}
                      class="w-full bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg shadow-cyan-500/20 transition-all flex items-center justify-center gap-3 disabled:opacity-50"
                    >
                      {loading ? (
                        <>
                          <i class="fa-solid fa-circle-notch fa-spin text-lg"></i>
                          <span>Processing with Gemini LLM Engine...</span>
                        </>
                      ) : (
                        <>
                          <i class="fa-solid fa-wand-magic-sparkles text-lg"></i>
                          <span>Analyze Candidate Match with Gemini AI</span>
                        </>
                      )}
                    </button>
                  </form>
                </div>
              </div>

              {/* Right Column: AI Insights & Scoring */}
              <div class="lg:col-span-6 flex flex-col gap-6">
                {result ? (
                  <div class="bg-slate-800/80 border border-slate-700/80 rounded-2xl p-6 shadow-xl backdrop-blur-sm space-y-6">
                    {/* Candidate Match Score Banner */}
                    <div class="flex items-center justify-between p-5 bg-gradient-to-r from-slate-900 via-blue-950 to-slate-900 rounded-xl border border-blue-500/30">
                      <div>
                        <span class="text-xs font-semibold uppercase tracking-wider text-cyan-400">
                          AI Compatibility Score
                        </span>
                        <h3 class="text-xl font-extrabold text-white mt-1">
                          {result.candidateName}
                        </h3>
                        <p class="text-xs text-slate-400">{result.email}</p>
                      </div>
                      <div class="text-center">
                        <div class="inline-flex items-center justify-center h-20 w-20 rounded-full border-4 border-cyan-400/80 bg-cyan-950/60 shadow-lg shadow-cyan-500/30">
                          <span class="text-2xl font-black text-cyan-300">
                            {result.matchScore}%
                          </span>
                        </div>
                      </div>
                    </div>

                    {/* Extracted Skills */}
                    <div>
                      <h4 class="text-xs font-bold text-slate-300 uppercase tracking-wider mb-2.5 flex items-center gap-2">
                        <i class="fa-solid fa-tags text-cyan-400"></i>
                        Extracted Technical Skills
                      </h4>
                      <div class="flex flex-wrap gap-2">
                        {result.extractedSkills?.map((s, idx) => (
                          <span key={idx} class="px-2.5 py-1 bg-cyan-950/60 border border-cyan-500/40 text-cyan-300 text-xs rounded-lg font-medium">
                            {s}
                          </span>
                        ))}
                      </div>
                    </div>

                    {/* Strengths */}
                    <div>
                      <h4 class="text-xs font-bold text-emerald-400 uppercase tracking-wider mb-2 flex items-center gap-2">
                        <i class="fa-solid fa-circle-check"></i>
                        Key Candidate Strengths
                      </h4>
                      <ul class="space-y-1.5">
                        {result.strengths?.map((str, idx) => (
                          <li key={idx} class="text-xs text-slate-300 flex items-start gap-2 bg-emerald-950/20 border border-emerald-500/20 p-2.5 rounded-lg">
                            <i class="fa-solid fa-check text-emerald-400 mt-0.5"></i>
                            <span>{str}</span>
                          </li>
                        ))}
                      </ul>
                    </div>

                    {/* Missing Skills / Skills Gap */}
                    <div>
                      <h4 class="text-xs font-bold text-amber-400 uppercase tracking-wider mb-2 flex items-center gap-2">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                        Identified Skill Gaps
                      </h4>
                      <div class="flex flex-wrap gap-2">
                        {result.missingSkills?.map((gap, idx) => (
                          <span key={idx} class="px-2.5 py-1 bg-amber-950/40 border border-amber-500/40 text-amber-300 text-xs rounded-lg font-medium">
                            {gap}
                          </span>
                        ))}
                      </div>
                    </div>

                    {/* AI Recommendations */}
                    <div class="p-4 bg-slate-900/70 border border-slate-700/60 rounded-xl">
                      <h4 class="text-xs font-bold text-cyan-300 uppercase tracking-wider mb-1.5 flex items-center gap-2">
                        <i class="fa-solid fa-lightbulb"></i>
                        Gemini LLM Recommendations
                      </h4>
                      <p class="text-xs text-slate-300 leading-relaxed">
                        {result.recommendations}
                      </p>
                    </div>
                  </div>
                ) : (
                  <div class="h-full bg-slate-800/40 border-2 border-dashed border-slate-700/70 rounded-2xl p-8 flex flex-col items-center justify-center text-center">
                    <div class="p-4 bg-slate-900 rounded-full border border-slate-700 text-slate-400 mb-4">
                      <i class="fa-solid fa-chart-pie text-3xl text-cyan-400"></i>
                    </div>
                    <h3 class="text-base font-bold text-white mb-1">
                      No Analysis Generated Yet
                    </h3>
                    <p class="text-xs text-slate-400 max-w-sm mb-6">
                      Click the "Analyze Candidate Match" button on the left to invoke the Gemini LLM engine and extract actionable semantic insights.
                    </p>
                    <div class="grid grid-cols-2 gap-3 w-full max-w-sm text-left">
                      <div class="p-3 bg-slate-900/60 border border-slate-800 rounded-xl text-xs text-slate-300">
                        <i class="fa-solid fa-bolt text-amber-400 mr-1.5"></i> Instant Semantic Scoring
                      </div>
                      <div class="p-3 bg-slate-900/60 border border-slate-800 rounded-xl text-xs text-slate-300">
                        <i class="fa-solid fa-database text-blue-400 mr-1.5"></i> MongoDB Persistence
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </div>

            {/* Past Analyses Table */}
            {history.length > 0 && (
              <div class="mt-10 bg-slate-800/80 border border-slate-700/80 rounded-2xl p-6 shadow-xl">
                <h3 class="text-base font-bold text-white mb-4 flex items-center gap-2">
                  <i class="fa-solid fa-clock-rotate-left text-cyan-400"></i>
                  Recent Candidate Evaluation Records (MongoDB Store)
                </h3>
                <div class="overflow-x-auto">
                  <table class="w-full text-left text-xs text-slate-300">
                    <thead class="text-xs uppercase bg-slate-900/80 text-slate-400 border-b border-slate-700">
                      <tr>
                        <th class="py-3 px-4">Candidate</th>
                        <th class="py-3 px-4">Target Role</th>
                        <th class="py-3 px-4">Match Score</th>
                        <th class="py-3 px-4">Top Extracted Skills</th>
                        <th class="py-3 px-4">Timestamp</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-700/60">
                      {history.map((item, idx) => (
                        <tr key={idx} class="hover:bg-slate-700/30">
                          <td class="py-3 px-4 font-semibold text-white">{item.candidateName}</td>
                          <td class="py-3 px-4 text-slate-300">{item.targetJobRole}</td>
                          <td class="py-3 px-4">
                            <span class="px-2 py-0.5 rounded-full font-bold bg-cyan-950 border border-cyan-500/40 text-cyan-300">
                              {item.matchScore}%
                            </span>
                          </td>
                          <td class="py-3 px-4 text-slate-300">
                            {item.extractedSkills?.slice(0, 4).join(', ') || 'N/A'}
                          </td>
                          <td class="py-3 px-4 text-slate-400">
                            {new Date(item.createdAt).toLocaleTimeString()}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}
          </main>

          {/* Footer */}
          <footer class="bg-slate-950 border-t border-slate-800 py-4 px-6 text-center text-xs text-slate-400">
            <p>
              AI Powered Resume Analyzer • Automated DevOps Pipeline (Terraform | Puppet | Docker | Jenkins | Nagios)
            </p>
            <p class="text-slate-400 mt-1">
              Course: INT333 | Submitted by: Aman Kumar Singh (Reg: 12301704)
            </p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
