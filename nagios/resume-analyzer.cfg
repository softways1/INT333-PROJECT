# Host Definition: DevOps Production Server
define host {
    use                     linux-server
    host_name               DevOps-Production-Server
    alias                   AI Resume Analyzer EC2 Host
    address                 127.0.0.1
    max_check_attempts      5
    check_period            24x7
    notification_interval   30
    notification_period     24x7
}

# Service: ICMP Ping Health
define service {
    use                     generic-service
    host_name               DevOps-Production-Server
    service_description     PING Check
    check_command           check_ping!100.0,20%!500.0,60%
}

# Service: CPU Load
define service {
    use                     generic-service
    host_name               DevOps-Production-Server
    service_description     Current Load
    check_command           check_local_load!5.0,4.0,3.0!10.0,6.0,4.0
}

# Service: Disk Space
define service {
    use                     generic-service
    host_name               DevOps-Production-Server
    service_description     Root Partition Disk Space
    check_command           check_local_disk!20%!10%!/
}

# Service: Total System Processes
define service {
    use                     generic-service
    host_name               DevOps-Production-Server
    service_description     Total Processes
    check_command           check_local_procs!250!400!RSZDT
}

# Service: Frontend Web UI (Port 80)
define service {
    use                     generic-service
    host_name               DevOps-Production-Server
    service_description     HTTP - React Web Dashboard
    check_command           check_http!-p 80
}

# Service: Backend REST API Health (Port 5000 /health)
define service {
    use                     generic-service
    host_name               DevOps-Production-Server
    service_description     HTTP - Backend REST API
    check_command           check_http!-p 5000 -u /health
}
